<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>V-Scroll 虚拟滚动条演示</title>

    <!-- Import Map - 可在此切换主题/样式 -->


    <!-- 外部样式覆盖示例 -->
    <style>
        /* 自定义主题 - 覆盖默认变量 */
        [v-scroll-host] {
            --v-scroll-track-bg: rgba(100, 100, 100, 0.15);
            --v-scroll-thumb-bg: rgba(100, 100, 100, 0.4);
            --v-scroll-thumb-hover-bg: rgba(100, 100, 100, 0.6);
            --v-scroll-thumb-drag-bg: rgba(100, 100, 100, 0.8);
            --v-scroll-track-width: 10px;
            --v-scroll-thumb-width: 10px;
        }

        /* 页面基础样式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        v-scroll {
            display: block;
            margin: 0 auto;
            background-color: #fff;
            width: 300px;
            height: 500px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .content-paragraph p {
            line-height: 2.8;
            color: #666;
            font-size: 20px;
        }
    </style>
    <script type="importmap">
  {
    "imports": {
      "$/v-scroll.js": "/v-scroll.js"
    }
  }
  </script>
  <script type="module" crossorigin src="/assets/index-DGqBh59-.js"></script>
</head>

<body>
    <h1>V-Scroll 虚拟滚动条组件演示</h1>

    <div class="demo-container">
        <div class="demo-box">
            <v-scroll id="scroll">
                <div class="content-paragraph">
                </div>
            </v-scroll>
        </div>
    </div>

</body>

</html>
